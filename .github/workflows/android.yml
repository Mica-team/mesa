name: Build Android

on:
  [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        arch: [ "arm32", "aarch64", "x86_64" ]
      fail-fast: false

    name: "Build for ${{matrix.arch}}"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compatible Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;21.4.7075529"
          sudo ln -sfn "$ANDROID_SDK_ROOT/ndk/21.4.7075529" "$ANDROID_SDK_ROOT/ndk-bundle"
          if [ "$ANDROID_SDK_ROOT" != "/usr/local/lib/android/sdk" ]; then
            sudo mkdir -p /usr/local/lib/android/sdk
            sudo ln -sfn "$ANDROID_SDK_ROOT/ndk/21.4.7075529" /usr/local/lib/android/sdk/ndk-bundle
          fi

      - name: Build
        run: |
          ln -s vulkan_android.pc vulkan.pc
          sudo apt update
          sudo apt install -y meson libxrandr-dev libxxf86vm-dev libxcb-*-dev libx11-xcb-dev libxfixes-dev libdrm-dev libx11-dev
          cp -R /usr/include/X11 include/
          cp -R /usr/include/xcb include/
          cp -R /usr/include/GL/* include/GL/
          pip3 install mako
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk-bundle"

          # Zink needs a Vulkan implementation. Build Turnip (Freedreno Vulkan)
          # for the Android ARM64 target; keep the x86_64 job Vulkan-free.
          if [ "${{matrix.arch}}" = "aarch64" ]; then
            VULKAN_DRIVERS=freedreno
            FREEDRENO_KGSL=true
          else
            VULKAN_DRIVERS=
            FREEDRENO_KGSL=false
          fi

          meson "build-android-${{matrix.arch}}" \
            --prefix=/tmp/zink \
            --cross-file "android-${{matrix.arch}}" \
            --buildtype debug \
            -Dplatforms=android \
            -Dplatform-sdk-version=24 \
            -Dandroid-stub=true \
            -Dllvm=disabled \
            -Dxlib-lease=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dosmesa=true \
            -Dvulkan-drivers="$VULKAN_DRIVERS" \
            -Dfreedreno-kgsl="$FREEDRENO_KGSL" \
            -Dgallium-drivers=zink,virgl \
            -Dshared-glapi=false
          ninja -C "build-android-${{matrix.arch}}" install

          # Preserve the Zink static archive for inspection; it is not loadable by Mojo.
          if [ -f "build-android-${{matrix.arch}}/src/gallium/drivers/zink/libzink.a" ]; then
            cp "build-android-${{matrix.arch}}/src/gallium/drivers/zink/libzink.a" /tmp/zink/lib/
          fi

          rm /tmp/zink/lib/libOSMesa.so /tmp/zink/lib/libOSMesa.so.8
          mv /tmp/zink/lib/libOSMesa.so.8.0.0 /tmp/zink/lib/libOSMesa.so.8
          cp /tmp/zink/lib/libOSMesa.so.8 /tmp/zink/lib/libOSMesa_unstripped.so.8
          if [ "${{matrix.arch}}" == "arm32" ]; then
            /usr/local/lib/android/sdk/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-strip /tmp/zink/lib/libOSMesa.so.8
          else
            /usr/local/lib/android/sdk/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/${{matrix.arch}}-linux-android-strip /tmp/zink/lib/libOSMesa.so.8
          fi

      - name: Prepare Android-friendly artifact
        run: |
          set -eu

          # Zink may be installed as its own DRI library; do not assume every Mesa
          # configuration creates a libgallium_dri.so megadriver.
          test -e /tmp/zink/lib/dri/zink_dri.so

          echo "Files before converting symbolic links:"
          find /tmp/zink -maxdepth 4 \( -name 'libgallium_dri.so' -o -name 'zink_dri.so' -o -name 'libGL.so*' -o -name 'libOSMesa.so*' \) -print

          # Android archive managers often cannot create Unix symbolic links.
          # Save the link list first so failures in the loop propagate to this step.
          find /tmp/zink -type l -print0 > /tmp/zink-symlinks.list
          while IFS= read -r -d '' link; do
            target="$(readlink -f "$link" || true)"
            if [ -n "$target" ] && [ -f "$target" ]; then
              tmp="${link}.regular-file"
              cp -L "$link" "$tmp"
              rm "$link"
              mv "$tmp" "$link"
            else
              echo "Could not resolve symbolic link: $link" >&2
              exit 1
            fi
          done < /tmp/zink-symlinks.list

          echo "Final artifact files:"
          find /tmp/zink -maxdepth 4 -type f -print | sort
          test -f /tmp/zink/lib/dri/zink_dri.so

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: libzink_${{matrix.arch}}
          path: /tmp/zink

  publish-release:
    name: Publish Mesa Zink release assets
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/21.2-virgl'
    runs-on: ubuntu-22.04
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libzink_*
          path: artifacts

      - name: Package release assets
        run: |
          set -eu
          mkdir -p release
          for arch in arm32 aarch64 x86_64; do
            test -d "artifacts/libzink_$arch"
            (cd "artifacts/libzink_$arch" && zip -qr "../../release/mesa-zink-$arch.zip" .)
          done
          ls -lh release

      - name: Publish latest Mesa Zink assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesa-zink-latest
          name: Mesa Zink (latest successful build)
          prerelease: true
          make_latest: false
          files: release/mesa-zink-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
